name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -B --no-transfer-progress

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualShop-jar
          path: target/VirtualShop-*.jar
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -B --no-transfer-progress

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: VirtualShop ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## VirtualShop ${{ steps.get_version.outputs.VERSION }}

            ### Telepítés
            1. Másold a `VirtualShop-*.jar` fájlt a szerver `plugins/` mappájába.
            2. Győződj meg róla, hogy **Vault** és egy gazdasági plugin (pl. EssentialsX) telepítve van.
            3. Opcionálisan telepítsd a **FancyHolograms** plugint a jobb hologramokért.
            4. Indítsd újra a szervert.

            ### Függőségek
            - **Vault** (kötelező)
            - **FancyHolograms** (opcionális)
          files: target/VirtualShop-*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
